<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>遊戲關卡與數值模擬器</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .box { background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px; width: 350px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .result { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .result p { margin: 8px 0; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="box">
        <h2>遊戲數值即時模擬</h2>
        
        <div class="input-group">
            <label for="stageInput">目前關卡數 ($N$)：</label>
            <input type="number" id="stageInput" value="1" min="0" oninput="calculate()">
        </div>

        <div class="input-group">
            <label for="levelInput">植物目前等級 ($L$)：</label>
            <input type="number" id="levelInput" value="1" min="1" oninput="calculate()">
        </div>
        
        <div class="result">
            <p>當前等級上限：<span id="maxLevel">6</span></p>
            <p>怪物數量：<span id="monsterCount">10</span> 隻</p>
            <p>Plant 數值：<span id="plantStat">136.5</span></p>
        </div>
    </div>

    <script>
        function calculate() {
            let n = parseInt(document.getElementById('stageInput').value) || 0;
            let level = parseInt(document.getElementById('levelInput').value) || 1;
            
            // 1. 等級上限：起初 5，每關加 1
            let maxLevel = 5 + n;
            
            // 限制植物等級不能超過當前等級上限
            if (level > maxLevel) {
                level = maxLevel;
            }
            
            // 2. 怪物數量：基準 10 隻，每 5 關增加 2 隻
            let baseMonster = 10;
            let monsterCount = baseMonster + Math.floor(n / 5) * 2;
            
            // 3. Plant 數值：假設基礎數值為 100，每關 +5%，每級 +30%
            let basePlantStat = 100;
            let stageMultiplier = 1 + (0.05 * n);
            let levelMultiplier = 1 + (0.30 * (level - 1)); // 假設第1級為基準 0 額外加成
            let plantStat = basePlantStat * stageMultiplier * levelMultiplier;
            
            document.getElementById('maxLevel').innerText = maxLevel;
            document.getElementById('monsterCount').innerText = monsterCount;
            document.getElementById('plantStat').innerText = plantStat.toFixed(1);
        }
    </script>

</body>
</html>
